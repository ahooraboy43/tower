<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مدیریت ساختمان پلاک ۳</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb; --primary-dark: #1d4ed8;
            --success: #10b981; --danger: #ef4444; --danger-light: #fef2f2;
            --bg-body: #f8fafc; --bg-card: #ffffff;
            --text-main: #0f172a; --text-muted: #64748b;
            --border-color: #e2e8f0; --radius-md: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); padding-bottom: 70px; }
        .app-header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; padding: 18px 20px; position: sticky; top: 0; z-index: 100; }
        .container { padding: 16px; max-width: 600px; margin: 0 auto; }
        .card { background: var(--bg-card); border-radius: var(--radius-md); padding: 16px; margin-bottom: 16px; border: 1px solid var(--border-color); }
        .card-title { font-weight: 700; margin-bottom: 12px; border-bottom: 1px dashed var(--border-color); padding-bottom: 8px; display: flex; justify-content: space-between; }
        .btn { display: block; width: 100%; padding: 12px; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; border: none; text-align: center; margin-top: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: var(--bg-card); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 99; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; background: none; border: none; color: var(--text-muted); font-size: 0.75rem; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .form-control { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: var(--radius-md); margin-bottom: 10px; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; overflow-y: auto; padding: 20px; }
        .modal.active { display: block; }
        .modal-content { background: var(--bg-card); max-width: 500px; margin: 0 auto; border-radius: 20px; padding: 20px; }
        .wizard-step { display: none; }
        .wizard-step.active { display: block; }
    </style>
</head>
<body>

    <header class="app-header"><div>پلاک ۳</div></header>

    <div class="container">
        <div id="tab-dashboard" class="tab-content-section">
            <div class="card"><button class="btn btn-primary" onclick="openWizard()">➕ ایجاد قبض جدید</button></div>
            <div class="card"><div class="card-title">قبض‌های صادر شده</div><div id="bills-list"></div></div>
        </div>
        <div id="tab-units" class="tab-content-section" style="display:none;">
            <div class="card"><div class="card-title">لیست واحدها</div><div id="units-list"></div></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('dashboard')"><span>📊</span><span>داشبورد</span></button>
        <button class="nav-item" onclick="switchTab('units')"><span>🏠</span><span>واحدها</span></button>
    </nav>

    <!-- Wizard -->
    <div class="modal" id="wizard-modal">
        <div class="modal-content">
            <div class="wizard-step active" id="step1">
                <h3>اطلاعات قبض</h3>
                <input type="text" id="bill-name" class="form-control" placeholder="مثال: قبض تیر">
                <input type="text" id="bill-date" class="form-control" placeholder="تاریخ: 1404/04/01">
                <button class="btn btn-primary" onclick="nextStep(2)">بعدی</button>
            </div>
            <div class="wizard-step" id="step2">
                <h3>مبالغ کل (به ریال)</h3>
                <input type="number" id="w-water" class="form-control" placeholder="کل آب (نفراتی)">
                <input type="number" id="w-elec" class="form-control" placeholder="کل برق (واحدی)">
                <input type="number" id="w-gas" class="form-control" placeholder="کل گاز (واحدی)">
                <input type="number" id="w-clean" class="form-control" placeholder="کل نظافت (واحدی)">
                <button class="btn btn-primary" onclick="nextStep(5)">پیش‌نمایش نهایی</button>
            </div>
            <div class="wizard-step" id="step5">
                <h3>تایید نهایی</h3>
                <div id="preview-area"></div>
                <button class="btn btn-success" onclick="finalizeBill()">صدور قبض</button>
            </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('plaque3_db')) || {
            units: Array.from({length: 10}, (_, i) => ({ id: i + 1, name: `واحد ${i + 1}`, people: 2, balanceCarryover: 0, paid: 0 })),
            bills: []
        };

        let currentBill = {};

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content-section').forEach(el => el.style.display = 'none');
            document.getElementById(`tab-${tabId}`).style.display = 'block';
            if(tabId === 'units') renderUnits();
            if(tabId === 'dashboard') renderDashboard();
        }

        function openWizard() { document.getElementById('wizard-modal').classList.add('active'); }

        function nextStep(step) {
            if(step === 2) {
                currentBill.name = document.getElementById('bill-name').value;
                currentBill.date = document.getElementById('bill-date').value;
            } else if (step === 5) {
                currentBill.water = parseInt(document.getElementById('w-water').value) || 0;
                currentBill.elec = parseInt(document.getElementById('w-elec').value) || 0;
                currentBill.gas = parseInt(document.getElementById('w-gas').value) || 0;
                currentBill.clean = parseInt(document.getElementById('w-clean').value) || 0;
                renderPreview();
            }
            document.querySelectorAll('.wizard-step').forEach(el => el.classList.remove('active'));
            document.getElementById('step'+step).classList.add('active');
        }

        function renderPreview() {
            const totalResidents = db.units.reduce((sum, u) => sum + parseInt(u.people), 0);
            const totalUnits = db.units.length;
            const area = document.getElementById('preview-area');
            area.innerHTML = `<p>آب (نفراتی): ${currentBill.water.toLocaleString()} برای ${totalResidents} نفر</p>
                              <p>سایر (واحدی): ${(currentBill.elec + currentBill.gas + currentBill.clean).toLocaleString()} برای ${totalUnits} واحد</p>`;
        }

        function finalizeBill() {
            const totalResidents = db.units.reduce((sum, u) => sum + parseInt(u.people), 0);
            const totalUnits = db.units.length;
            
            // فرمول محاسبه
            const waterPerPerson = totalResidents > 0 ? (currentBill.water / totalResidents) : 0;
            const otherPerUnit = (currentBill.elec + currentBill.gas + currentBill.clean) / totalUnits;

            db.units.forEach(u => {
                const share = (waterPerPerson * parseInt(u.people)) + otherPerUnit;
                u.balanceCarryover += Math.round(share);
            });

            db.bills.push({...currentBill, date: new Date().toISOString()});
            localStorage.setItem('plaque3_db', JSON.stringify(db));
            document.getElementById('wizard-modal').classList.remove('active');
            alert('قبض با موفقیت صادر شد.');
            renderDashboard();
        }

        function renderUnits() {
            const container = document.getElementById('units-list');
            container.innerHTML = db.units.map((u, i) => `
                <div class="card">
                    <p>${u.name} - ${u.people} نفر</p>
                    <p>مانده بدهی: ${u.balanceCarryover.toLocaleString()} ریال</p>
                    <input type="number" id="pay-${i}" placeholder="مبلغ پرداختی">
                    <button class="btn btn-success" onclick="makePayment(${i})">ثبت پرداخت</button>
                </div>`).join('');
        }

        function makePayment(i) {
            const val = parseInt(document.getElementById('pay-'+i).value) || 0;
            db.units[i].balanceCarryover -= val;
            localStorage.setItem('plaque3_db', JSON.stringify(db));
            renderUnits();
        }

        function renderDashboard() {
            document.getElementById('bills-list').innerHTML = db.bills.map(b => `<p>${b.name} (${b.date.split('T')[0]})</p>`).join('');
        }

        switchTab('dashboard');
    </script>
</body>
</html>
